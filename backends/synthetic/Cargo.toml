[package]
name = "mt-synthetic-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
publish = false

[dependencies]
axum = { version = "=0.8.6", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
